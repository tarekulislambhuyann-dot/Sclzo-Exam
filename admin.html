<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sclzo Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f3f4f8;color:#1f2430}
header{position:sticky;top:0;background:#4338ca;color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;z-index:6}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://amyndifcebeffgsxwiec.supabase.co','sb_publishable_WFiJ2YoKmzQ_b1yh9-sR1Q_FvuGVRzP');
let recovering=false;
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;newPwView()}});
const $=s=>document.querySelector(s),v=s=>$(s).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=h=>{$('#app').innerHTML=h};
const TYPES={chapter_test:'চ্যাপ্টার টেস্ট',class_test:'ক্লাস টেস্ট',weekly:'সাপ্তাহিক',model_test:'মডেল টেস্ট',half_yearly:'অর্ধবার্ষিক',final:'বার্ষিক'};
const CATS=[5,6,7,8,9,10,11,12].map(c=>['c'+c,'ক্লাস '+c]).concat([['ssc','SSC'],['hsc','HSC'],['admission','ভর্তি'],['job','চাকরি']]);
const catInfo=k=>/^c\d+$/.test(k)?{category:'school',class_level:+k.slice(1)}:{category:k,class_level:null};
let me=null,profile={},isAdmin=false,sel=new Set(),loaded=[];

function ui(tabk,body){
  const T=[['mcq','➕ MCQ'],['imp','📥 ইমপোর্ট'],['exam','📝 পরীক্ষা'],['res','📊 ফলাফল']].concat(isAdmin?[['appr','✅ অনুমোদন'],['sub','📚 বিষয়'],['usr','👥 ইউজার'],['pay','💰 পেমেন্ট']]:[['mine','🗂 আমার MCQ']]);
  show(`<header><span>Sclzo ${isAdmin?'Admin':'Teacher'}</span><button class="link" style="color:#fff" onclick="logout()">লগআউট</button></header>
  <div class="tabs">${T.map(([k,n])=>`<button class="${k===tabk?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}</div><main>${body}</main>`);
}
function go(k){({mcq:vMcq,imp:vImp,exam:vExam,res:vRes,appr:vAppr,sub:vSub,usr:vUsr,pay:vPay,mine:vMine})[k]()}

/* subject picker */
const pk=p=>`<select id="${p}cat" onchange="loadSubs('${p}')">${CATS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><select id="${p}sub" onchange="loadChs('${p}')"></select><select id="${p}ch"></select>`;
async function loadSubs(p){
  const key=$('#'+p+'cat').value;let q=sb.from('subjects').select('id,name').order('name');
  const i=catInfo(key);q=i.class_level?q.eq('category','school').eq('class_level',i.class_level):q.eq('category',key);
  const {data}=await q;
  $('#'+p+'sub').innerHTML=(data||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')||'<option value="">— বিষয় নেই —</option>';
  loadChs(p);
}
async function loadChs(p){
  const sid=$('#'+p+'sub').value;
  if(!sid){$('#'+p+'ch').innerHTML='<option value="">— অধ্যায় নেই —</option>';return}
  const {data}=await sb.from('chapters').select('id,name').eq('subject_id',sid).order('sort_order');
  $('#'+p+'ch').innerHTML='<option value="">সব অধ্যায়</option>'+(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
}
const STATUS=()=>isAdmin?{source:'main',status:'approved'}:{source:'teacher',status:'private'};

/* ---------- AUTH ---------- */
function loginView(){
  show(`<header>Sclzo Admin / Teacher</header><main><div class="card"><h3>লগইন</h3><input id="em" type="email" placeholder="ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড"><button class="btn" onclick="doLogin()">লগইন</button><button class="link" onclick="resetPw()">পাসওয়ার্ড ভুলে গেছেন?</button></div></main>`);
}
async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({email:v('#em'),password:$('#pw').value});
  if(error)return alert(error.message);boot();
}
async function logout(){await sb.auth.signOut();loginView()}
async function resetPw(){
  const email=v('#em');if(!email)return alert('আগে ইমেইল ঘরে আপনার ইমেইল লিখুন');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin.html'});
  alert(error?error.message:'পাসওয়ার্ড রিসেটের লিংক ইমেইলে পাঠানো হয়েছে। ইনবক্স ও স্প্যাম দেখুন।');
}
function newPwView(){
  show(`<header>নতুন পাসওয়ার্ড</header><main><div class="card"><input id="np" type="password" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)"><button class="btn" onclick="setPw()">সেভ করুন</button></div></main>`);
}
async function setPw(){
  const p=$('#np').value;if(p.length<8)return alert('কমপক্ষে ৮ অক্ষর দিন');
  const {error}=await sb.auth.updateUser({password:p});
  if(error)return alert(error.message);
  alert('পাসওয়ার্ড বদলেছে ✅');recovering=false;boot();
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(recovering)return;
  if(!session)return loginView();
  me=session.user;
  const {data,error:pe}=await sb.from('profiles').select('*').eq('id',me.id).single();
  profile=data||{};isAdmin=profile.role==='admin';
  if(!['admin','teacher'].includes(profile.role)){
    show(`<header>Sclzo</header><main><div class="card"><p>এই প্যানেল শুধু টিচার ও অ্যাডমিনের জন্য।</p>
    <p><small>এখন লগইন করা আছে: <b>${esc(me.email)}</b><br>রোল: ${esc(profile.role||'পাওয়া যায়নি')}</small></p>
    ${pe?`<p style="color:#b91c1c">প্রোফাইল লোড হয়নি: ${esc(pe.message)}</p>`:''}
    ${profile.requested_role?'<p>⏳ আপনার টিচার/প্রতিষ্ঠানের অনুরোধ অ্যাডমিনের অনুমোদনের অপেক্ষায় আছে।</p>':''}
    <button class="btn" onclick="logout()">অন্য অ্যাকাউন্টে লগইন করুন</button><a class="link" href="/">← স্টুডেন্ট অ্যাপে যান</a></div></main>`);return;
  }
  vMcq();
}

/* ---------- ADD MCQ ---------- */
function vMcq(){
  ui('mcq',`<div class="card"><h3>নতুন MCQ</h3>${pk('m')}<textarea id="q" placeholder="প্রশ্ন"></textarea>
  <input id="oa" placeholder="ক"><input id="ob" placeholder="খ"><input id="oc" placeholder="গ"><input id="od" placeholder="ঘ">
  <select id="co"><option value="a">সঠিক: ক</option><option value="b">সঠিক: খ</option><option value="c">সঠিক: গ</option><option value="d">সঠিক: ঘ</option></select>
  <textarea id="ex" placeholder="ব্যাখ্যা (ঐচ্ছিক)"></textarea><button class="btn" onclick="saveMcq()">সেভ করুন</button>
  <small>${isAdmin?'সরাসরি মূল ব্যাংকে যাবে।':'আপনার প্রাইভেট ব্যাংকে থাকবে। "আমার MCQ" থেকে মূল ব্যাংকে পাঠানো যাবে।'}</small></div>`);
  loadSubs('m');
}
async function saveMcq(){
  const sid=+$('#msub').value;if(!sid)return alert('বিষয় নির্বাচন করুন');
  const f={question:v('#q'),option_a:v('#oa'),option_b:v('#ob'),option_c:v('#oc'),option_d:v('#od')};
  if(Object.values(f).some(x=>!x))return alert('প্রশ্ন ও ৪টি অপশন লিখুন');
  const {data,error}=await sb.from('mcqs').insert({...f,subject_id:sid,chapter_id:+$('#mch').value||null,...STATUS()}).select('id').single();
  if(error)return alert(error.message);
  const {error:e2}=await sb.from('mcq_keys').insert({mcq_id:data.id,correct_option:$('#co').value,explanation:v('#ex')||null});
  if(e2)return alert(e2.message);
  ['q','oa','ob','oc','od','ex'].forEach(i=>$('#'+i).value='');alert('সেভ হয়েছে ✅');
}

/* ---------- BULK IMPORT ---------- */
const MP={'ক':'a','খ':'b','গ':'c','ঘ':'d',a:'a',b:'b',c:'c',d:'d','1':'a','2':'b','3':'c','4':'d'};
function vImp(){
  ui('imp',`<div class="card"><h3>একসাথে অনেক MCQ</h3>${pk('i')}
  <small>প্রতিটি প্রশ্নের জন্য আলাদা ঘর: প্রশ্ন, ক, খ, গ, ঘ, সঠিক উত্তর, ব্যাখ্যা। অনেক প্রশ্ন হলে CSV ফাইল দিন (Excel থেকে Save as CSV)।</small>
  <input type="file" id="csv" accept=".csv,text/csv" onchange="readCsv(this)">
  <a class="link" download="mcq_template.csv" href="data:text/csv;charset=utf-8,%EF%BB%BFquestion,option_a,option_b,option_c,option_d,correct,explanation%0A">⬇ CSV টেমপ্লেট নামান</a></div>
  <div id="rw"></div><button class="btn2" onclick="addRow()">➕ আরেকটি প্রশ্ন</button><button class="btn" onclick="saveRows()">সব সেভ করুন</button><br><br>`);
  loadSubs('i');addRow();
}
function addRow(){
  const d=document.createElement('div');d.className='card mr';
  d.innerHTML=`<textarea class="rq" placeholder="প্রশ্ন"></textarea><input class="ra" placeholder="ক"><input class="rb" placeholder="খ"><input class="rc" placeholder="গ"><input class="rd" placeholder="ঘ">
  <select class="rk"><option value="">সঠিক উত্তর বাছুন</option><option value="a">ক</option><option value="b">খ</option><option value="c">গ</option><option value="d">ঘ</option></select>
  <textarea class="re" placeholder="ব্যাখ্যা (ঐচ্ছিক)"></textarea><button class="btn2" onclick="this.parentNode.remove()">✖ মুছুন</button>`;
  $('#rw').appendChild(d);
}
function saveRows(){
  const L=[...document.querySelectorAll('#rw .mr')].map(d=>{const g=c=>d.querySelector(c).value.trim();return {q:g('.rq'),a:g('.ra'),b:g('.rb'),c:g('.rc'),d:g('.rd'),k:g('.rk'),e:g('.re')}}).filter(r=>r.q||r.a||r.b||r.c||r.d);
  insertRows(L,true);
}
async function insertRows(L,clear){
  const sid=+$('#isub').value;if(!sid)return alert('বিষয় নির্বাচন করুন');
  const cid=+$('#ich').value||null,bad=[];
  L.forEach((r,i)=>{if(!r.q||!r.a||!r.b||!r.c||!r.d||!MP[String(r.k).toLowerCase()])bad.push(i+1)});
  if(!L.length)return alert('কোনো প্রশ্ন নেই');
  if(bad.length)return alert('এই নম্বরের প্রশ্নে ঘর ফাঁকা বা সঠিক উত্তর ঠিক নয়: '+bad.slice(0,20).join(', '));
  let n=0;
  for(let i=0;i<L.length;i+=100){
    const ch=L.slice(i,i+100);
    const {data,error}=await sb.from('mcqs').insert(ch.map(r=>({subject_id:sid,chapter_id:cid,question:r.q,option_a:r.a,option_b:r.b,option_c:r.c,option_d:r.d,...STATUS()}))).select('id');
    if(error)return alert(n+'টি সেভ হয়েছে, তারপর এরর: '+error.message);
    const {error:e2}=await sb.from('mcq_keys').insert(data.map((d,j)=>({mcq_id:d.id,correct_option:MP[String(ch[j].k).toLowerCase()],explanation:ch[j].e||null})));
    if(e2)return alert(e2.message);n+=data.length;
  }
  alert(n+'টি MCQ সেভ হয়েছে ✅');if(clear){$('#rw').innerHTML='';addRow()}
}
function parseCsv(t){
  const r=[];let row=[],f='',q=false;t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))r.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))r.push(row);return r;
}
function readCsv(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const R=parseCsv(String(rd.result));
    if(R.length&&/^(question|প্রশ্ন)$/i.test(R[0][0].trim()))R.shift();
    const L=R.map(c=>({q:(c[0]||'').trim(),a:(c[1]||'').trim(),b:(c[2]||'').trim(),c:(c[3]||'').trim(),d:(c[4]||'').trim(),k:(c[5]||'').trim(),e:(c[6]||'').trim()}));
    if(!L.length)return alert('ফাইলে কোনো প্রশ্ন পাওয়া যায়নি');
    if(confirm(L.length+'টি MCQ পাওয়া গেছে। সেভ করবেন?'))insertRows(L,false);
    inp.value='';
  };
  rd.readAsText(f,'UTF-8');
}

/* ---------- CREATE EXAM ---------- */
function vExam(){
  sel=new Set();loaded=[];
  ui('exam',`<div class="card"><h3>নতুন পরীক্ষা</h3>
  <input id="et" placeholder="পরীক্ষার নাম">
  <select id="ety">${Object.entries(TYPES).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select>
  <input id="inst" placeholder="প্রতিষ্ঠানের নাম" value="${esc(profile.institution_name||'')}">
  ${pk('e')}<label><input type="checkbox" id="mix">মিশ্র বিষয় (চাকরি/ভর্তি — একাধিক বিষয়ের প্রশ্ন)</label>
  <small>সময় (মিনিট) — যত খুশি: ১০, ১৫, ২০, ৩০, ৪০…</small><input id="dur" type="number" min="1" max="300" value="30">
  <small>প্রতি প্রশ্নের নম্বর</small><input id="mk" type="number" step="0.5" value="1">
  <label><input type="checkbox" id="neg">নেগেটিভ মার্কিং</label><input id="nm" type="number" step="0.05" value="0.25" placeholder="ভুলে কাটা নম্বর">
  <small>শুরুর সময় (ফাঁকা = এখনই)</small><input id="st" type="datetime-local"><small>শেষ সময় (ফাঁকা = সীমা নেই)</small><input id="en" type="datetime-local"></div>
  <div class="card"><h3>প্রশ্ন বাছাই <span id="cnt"></span></h3>
  <button class="btn" onclick="loadQs()">এই অধ্যায়ের প্রশ্ন দেখান</button>
  <div class="row"><input id="rn" type="number" placeholder="র‍্যান্ডম কয়টি?"><button class="btn2" onclick="pickRand()">র‍্যান্ডম বাছাই</button></div>
  <div id="ql"></div></div><button class="btn" onclick="makeExam()">পরীক্ষা পাবলিশ করুন</button><br><br>`);
  loadSubs('e');
  $('#ecat').addEventListener('change',()=>{$('#neg').checked=['job','admission'].includes($('#ecat').value)});
}
async function loadQs(){
  const sid=+$('#esub').value;if(!sid)return alert('বিষয় নির্বাচন করুন');
  let q=sb.from('mcqs').select('id,question,status').eq('subject_id',sid).in('status',['approved','private','pending']).order('id').limit(300);
  const cid=+$('#ech').value;if(cid)q=q.eq('chapter_id',cid);
  const {data,error}=await q;if(error)return alert(error.message);
  loaded=data||[];drawQs();
}
function drawQs(){
  $('#ql').innerHTML=loaded.map(m=>`<div class="q"><input type="checkbox" ${sel.has(m.id)?'checked':''} onchange="tog(${m.id},this.checked)"><span>${esc(m.question)}${m.status!=='approved'?' <small>(প্রাইভেট)</small>':''}</span></div>`).join('')||'<p>কোনো প্রশ্ন নেই</p>';
  $('#cnt').textContent='— বাছাই: '+sel.size+'টি';
}
function tog(id,on){on?sel.add(id):sel.delete(id);$('#cnt').textContent='— বাছাই: '+sel.size+'টি'}
function pickRand(){
  const n=+$('#rn').value;if(!n||!loaded.length)return alert('আগে প্রশ্ন লোড করুন ও সংখ্যা দিন');
  sel=new Set([...loaded].sort(()=>Math.random()-.5).slice(0,n).map(m=>m.id));drawQs();
}
async function makeExam(){
  const ids=[...sel],title=v('#et');
  if(!title||!ids.length)return alert('পরীক্ষার নাম দিন ও প্রশ্ন বাছাই করুন');
  const dur=+$('#dur').value;if(!(dur>=1&&dur<=300))return alert('সময় ১–৩০০ মিনিটের মধ্যে দিন');
  const info=catInfo($('#ecat').value),mix=$('#mix').checked;
  const row={title,exam_type:$('#ety').value,category:info.category,class_level:info.class_level,
    subject_id:mix?null:(+$('#esub').value||null),chapter_id:mix?null:(+$('#ech').value||null),
    institution_name:v('#inst')||null,duration_minutes:dur,marks_per_question:+$('#mk').value||1,
    negative_marking:$('#neg').checked,negative_mark:+$('#nm').value||0.25,
    start_time:$('#st').value?new Date($('#st').value).toISOString():null,
    end_time:$('#en').value?new Date($('#en').value).toISOString():null,status:'published',visibility:isAdmin?'public':'private'};
  const {data,error}=await sb.from('exams').insert(row).select('id,share_code').single();
  if(error)return alert(error.message);
  const {error:e2}=await sb.from('exam_questions').insert(ids.map((id,i)=>({exam_id:data.id,mcq_id:id,sort_order:i})));
  if(e2)return alert(e2.message);
  showLink(data.share_code,title);
}

/* ---------- RESULTS ---------- */
let E=[];
const shareLink=c=>location.origin+'/?exam='+c;
async function copyLink(c){
  try{await navigator.clipboard.writeText(shareLink(c));alert('লিংক কপি হয়েছে ✅')}
  catch(e){prompt('লিংকটি কপি করুন:',shareLink(c))}
}
function showLink(c,t){
  ui('res',`<div class="card"><h3>✅ পাবলিশ হয়েছে</h3><b>${esc(t)}</b>
  <p>এই লিংক স্টুডেন্টদের দিন। লিংক খুলে লগইন করলেই পরীক্ষা পাবে। অন্য কেউ এই পরীক্ষা বা ফলাফল দেখতে পারবে না।</p>
  <input readonly value="${shareLink(c)}" onclick="this.select()"><button class="btn" onclick="copyLink('${c}')">🔗 লিংক কপি করুন</button>
  <button class="btn2" onclick="vRes()">আমার পরীক্ষাগুলো</button></div>`);
}
async function vRes(){
  ui('res','<p>লোড হচ্ছে…</p>');
  let q=sb.from('exams').select('id,title,share_code,duration_minutes,visibility').order('created_at',{ascending:false}).limit(30);
  if(!isAdmin)q=q.eq('created_by',me.id);
  const {data}=await q;E=data||[];
  ui('res',E.map((e,i)=>`<div class="card"><b>${esc(e.title)}</b><br><small>${e.duration_minutes} মিনিট · ${e.visibility==='public'?'সবার জন্য':'শুধু লিংকধারীর জন্য'}</small><br>
  <button class="btn2" onclick="vAtt(${i})">📊 ফলাফল ও র‍্যাংকিং</button><button class="btn2" onclick="copyLink('${e.share_code}')">🔗 লিংক কপি</button></div>`).join('')||'<p class="card">কোনো পরীক্ষা নেই</p>');
}
async function vAtt(i){
  const e=E[i];
  const {data,error}=await sb.rpc('exam_leaderboard',{p_exam_id:e.id});
  if(error)return alert(error.message);
  ui('res',`<button class="link" onclick="vRes()">← ফিরে যান</button><div class="card"><h3>${esc(e.title)}</h3><small>মোট ${(data||[]).length} জন জমা দিয়েছে</small>
  ${(data||[]).map(a=>`<p><b>${a.rnk}.</b> ${esc(a.student_name||'নাম নেই')} — <b>${a.score}</b><br><small>রোল ${esc(a.roll||'-')} · ${esc(a.institution||'-')} · ${esc(a.class_name||'-')}<br>✅ সঠিক ${a.correct_count} · ❌ ভুল ${a.wrong_count} · ⚪ বাদ ${a.skipped_count}</small></p>`).join('')||'<p>এখনো কেউ জমা দেয়নি</p>'}</div>`);
}

/* ---------- TEACHER: MY MCQs ---------- */
async function vMine(){
  ui('mine','<p>লোড হচ্ছে…</p>');
  const {data}=await sb.from('mcqs').select('id,question,status').eq('created_by',me.id).order('id',{ascending:false}).limit(40);
  const L={private:'প্রাইভেট',pending:'অনুমোদনের অপেক্ষায়',approved:'মূল ব্যাংকে',rejected:'বাতিল'};
  ui('mine',(data||[]).map(m=>`<div class="card">${esc(m.question)}<br><small>${L[m.status]||m.status}</small>${m.status==='private'?`<br><button class="btn2" onclick="submitMain(${m.id})">মূল ব্যাংকে পাঠান</button>`:''}</div>`).join('')||'<p class="card">কোনো MCQ নেই</p>');
}
async function submitMain(id){
  const {error}=await sb.from('mcqs').update({status:'pending'}).eq('id',id);
  if(error)return alert(error.message);vMine();
}

/* ---------- ADMIN: APPROVALS ---------- */
async function vAppr(){
  ui('appr','<p>লোড হচ্ছে…</p>');
  const {data}=await sb.from('mcqs').select('id,question,option_a,option_b,option_c,option_d').eq('status','pending').order('id').limit(30);
  const ids=(data||[]).map(m=>m.id),K={};
  if(ids.length){const {data:k}=await sb.from('mcq_keys').select('mcq_id,correct_option').in('mcq_id',ids);(k||[]).forEach(x=>K[x.mcq_id]=x.correct_option)}
  ui('appr',(data||[]).map(m=>`<div class="card"><b>${esc(m.question)}</b><br><small>ক) ${esc(m.option_a)} খ) ${esc(m.option_b)} গ) ${esc(m.option_c)} ঘ) ${esc(m.option_d)}<br>সঠিক: ${esc(K[m.id]||'?')}</small><br>
  <button class="btn2" onclick="setSt(${m.id},'approved')">✅ অনুমোদন</button><button class="btn2" onclick="setSt(${m.id},'rejected')">❌ বাতিল</button></div>`).join('')||'<p class="card">কোনো অপেক্ষমাণ MCQ নেই</p>');
}
async function setSt(id,st){
  const u=st==='approved'?{status:st,source:'main'}:{status:st};
  const {error}=await sb.from('mcqs').update(u).eq('id',id);
  if(error)return alert(error.message);vAppr();
}

/* ---------- ADMIN: SUBJECTS & CHAPTERS ---------- */
function vSub(){
  ui('sub',`<div class="card"><h3>নতুন বিষয়</h3><select id="sc">${CATS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><input id="sn" placeholder="বিষয়ের নাম (যেমন: গণিত)"><button class="btn" onclick="addSub()">বিষয় যোগ করুন</button></div>
  <div class="card"><h3>নতুন অধ্যায়</h3>${pk('c')}<input id="cn" placeholder="অধ্যায়ের নাম"><button class="btn" onclick="addCh()">অধ্যায় যোগ করুন</button></div>`);
  loadSubs('c');
}
async function addSub(){
  const i=catInfo($('#sc').value),name=v('#sn');if(!name)return alert('নাম লিখুন');
  const {error}=await sb.from('subjects').insert({name,category:i.category,class_level:i.class_level});
  if(error)return alert(error.message);alert('যোগ হয়েছে ✅');$('#sn').value='';loadSubs('c');
}
async function addCh(){
  const sid=+$('#csub').value,name=v('#cn');if(!sid||!name)return alert('বিষয় ও অধ্যায়ের নাম দিন');
  const {count}=await sb.from('chapters').select('id',{count:'exact',head:true}).eq('subject_id',sid);
  const {error}=await sb.from('chapters').insert({subject_id:sid,name,sort_order:(count||0)+1});
  if(error)return alert(error.message);alert('যোগ হয়েছে ✅');$('#cn').value='';loadChs('c');
}

/* ---------- ADMIN: USERS ---------- */
let U=[];
async function vUsr(){
  ui('usr','<p>লোড হচ্ছে…</p>');
  const {data}=await sb.from('profiles').select('id,full_name,role,institution_name,requested_role').order('created_at',{ascending:false}).limit(100);
  U=(data||[]).sort((a,b)=>!!b.requested_role-!!a.requested_role);
  ui('usr',U.map((u,i)=>`<div class="card"><b>${esc(u.full_name||'(নাম নেই)')}</b>${u.requested_role?' <span style="color:#b45309">⏳ টিচার/প্রতিষ্ঠান হতে চায়</span>':''}<br><select id="ur${i}"><option value="student" ${u.role==='student'?'selected':''}>স্টুডেন্ট</option><option value="teacher" ${u.role==='teacher'?'selected':''}>টিচার</option><option value="admin" ${u.role==='admin'?'selected':''}>অ্যাডমিন</option></select>
  <input id="ui${i}" placeholder="প্রতিষ্ঠানের নাম" value="${esc(u.institution_name||'')}"><button class="btn2" onclick="saveUser(${i})">সেভ</button>${u.requested_role?`<button class="btn2" onclick="approveTeacher(${i})">✅ টিচার করুন</button>`:''}</div>`).join(''));
}
async function approveTeacher(i){
  const {error}=await sb.from('profiles').update({role:'teacher',requested_role:null}).eq('id',U[i].id);
  if(error)return alert(error.message);vUsr();
}
async function saveUser(i){
  const {error}=await sb.from('profiles').update({role:$('#ur'+i).value,institution_name:$('#ui'+i).value.trim()||null,requested_role:null}).eq('id',U[i].id);
  if(error)return alert(error.message);alert('সেভ হয়েছে ✅');
}

/* ---------- ADMIN: PAYMENTS ---------- */
async function vPay(){
  ui('pay','<p>লোড হচ্ছে…</p>');
  const [rq,st]=await Promise.all([sb.from('topup_requests').select('id,user_id,method,amount,sender,trx_id').eq('status','pending').order('id').limit(50),sb.from('app_settings').select('key,value')]);
  const C={};(st.data||[]).forEach(x=>C[x.key]=x.value);
  const ids=(rq.data||[]).map(r=>r.user_id),N={};
  if(ids.length){const {data:p}=await sb.from('profiles').select('id,full_name').in('id',ids);(p||[]).forEach(x=>N[x.id]=x.full_name)}
  ui('pay',`<div class="card"><h3>পেমেন্টের তথ্য (স্টুডেন্টরা দেখবে)</h3>
  <input id="s1" placeholder="bKash নম্বর" value="${esc(C.bkash_number||'')}"><input id="s2" placeholder="Nagad নম্বর" value="${esc(C.nagad_number||'')}">
  <input id="s3" placeholder="ব্যাংকের তথ্য" value="${esc(C.bank_info||'')}"><input id="s4" placeholder="অতিরিক্ত নির্দেশনা" value="${esc(C.pay_note||'')}">
  <button class="btn" onclick="saveSettings()">সেভ করুন</button></div>
  <h3>অপেক্ষমাণ অনুরোধ (${(rq.data||[]).length})</h3>
  ${(rq.data||[]).map(r=>`<div class="card"><b>৳ ${r.amount}</b> · ${esc(r.method)}<br><small>${esc(N[r.user_id]||'')} · পাঠিয়েছে: ${esc(r.sender)}<br>TrxID: <b>${esc(r.trx_id)}</b></small><br>
  <small>⚠️ আগে নিজের bKash/Nagad/ব্যাংকে TrxID ও টাকার পরিমাণ মিলিয়ে দেখুন, তারপর অনুমোদন দিন।</small><br>
  <button class="btn2" onclick="revTop(${r.id},true)">✅ অনুমোদন</button><button class="btn2" onclick="revTop(${r.id},false)">❌ বাতিল</button></div>`).join('')||'<p class="card">কোনো অনুরোধ নেই</p>'}`);
}
async function saveSettings(){
  const rows=[['bkash_number','#s1'],['nagad_number','#s2'],['bank_info','#s3'],['pay_note','#s4']].map(([k,i])=>({key:k,value:v(i)}));
  const {error}=await sb.from('app_settings').upsert(rows);
  alert(error?error.message:'সেভ হয়েছে ✅');
}
async function revTop(id,ok){
  if(ok&&!confirm('ট্রানজেকশন যাচাই করেছেন? অনুমোদন করলে ইউজারের ব্যালেন্সে টাকা যোগ হবে।'))return;
  const note=ok?'':(prompt('বাতিলের কারণ (ঐচ্ছিক):')||'');
  const {error}=await sb.rpc('review_topup',{p_id:id,p_approve:ok,p_note:note});
  if(error)return alert(error.message);vPay();
}

boot();
</script>
